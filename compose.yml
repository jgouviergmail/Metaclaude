# Metaclaude — production compose file.
#
# Two services:
#   app   — the agent OS, on an internal network only
#   proxy — Caddy, terminating TLS and the only thing bound to the host
#
# The app never publishes a port. Everything reaches it through the proxy, which
# means TLS is not optional and cannot be forgotten.
#
# Quick start:
#   cp .env.example .env    # then edit it
#   docker compose up -d

name: metaclaude

services:
  app:
    # A deployment sets METACLAUDE_IMAGE to the exact image CI built and tested
    # — `ghcr.io/<owner>/metaclaude:sha-<commit>` — so what runs here is the
    # artefact the tests ran against, not a rebuild of the same source. Left
    # unset, this builds locally, which is what a developer wants.
    image: ${METACLAUDE_IMAGE:-metaclaude:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Behind the proxy, TLS terminates upstream: honour X-Forwarded-For and
      # keep the Secure attribute on cookies.
      METACLAUDE_TRUST_PROXY: "1"

      METACLAUDE_MASTER_KEY: ${METACLAUDE_MASTER_KEY:-}
      METACLAUDE_BOOTSTRAP_USER: ${METACLAUDE_BOOTSTRAP_USER:-}
      METACLAUDE_BOOTSTRAP_PASSWORD: ${METACLAUDE_BOOTSTRAP_PASSWORD:-}
      METACLAUDE_ALLOWED_ORIGINS: ${METACLAUDE_ALLOWED_ORIGINS:-}
      METACLAUDE_MAX_CONCURRENT_RUNS: ${METACLAUDE_MAX_CONCURRENT_RUNS:-4}
      METACLAUDE_QUOTA_GUARD_PCT: ${METACLAUDE_QUOTA_GUARD_PCT:-85}
      METACLAUDE_RUN_TIMEOUT_MS: ${METACLAUDE_RUN_TIMEOUT_MS:-2700000}
      METACLAUDE_EMBEDDINGS: ${METACLAUDE_EMBEDDINGS:-hash}
      # Only read under `local`. Forwarded so the knob .env.example documents
      # is not silently discarded by the deployment that reads that file.
      METACLAUDE_EMBEDDING_MODEL: ${METACLAUDE_EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      METACLAUDE_ALLOW_BYPASS_PERMISSIONS: ${METACLAUDE_ALLOW_BYPASS_PERMISSIONS:-}
      METACLAUDE_UPDATE_REPO: ${METACLAUDE_UPDATE_REPO:-jgouviergmail/Metaclaude}
      METACLAUDE_UPDATES_DIR: /var/lib/metaclaude-updates

      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Metaclaude}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-metaclaude@localhost}
      TZ: ${TZ:-UTC}

    volumes:
      - metaclaude-data:/var/lib/metaclaude
      # Workspaces are a separate volume *and* a separate root, not a
      # subdirectory of the data one. They hold what the agent writes while
      # running model-authored commands; /var/lib/metaclaude holds the database,
      # the sealed vault and master.key. Nested, that separation is not real —
      # every workspace sat one `..` from the key — and `loadConfig` now refuses
      # to start on a layout where either contains the other.
      - metaclaude-workspaces:/srv/metaclaude/workspaces
      # The Claude CLI keeps its session transcripts under $HOME/.claude, and
      # Metaclaude resumes those sessions by id. On tmpfs they would vanish on
      # every restart and every existing conversation would start cold.
      - metaclaude-home:/home/metaclaude
      # The in-app update handshake: the app writes request.json here, the
      # host's metaclaude-updater unit consumes it and writes status.json
      # back. A bind mount on purpose — a named volume would be invisible to
      # the host unit. On a machine that never ran install-app.sh the
      # directory appears empty and the app reports the feature absent (the
      # installer's .updater-installed marker is the signal).
      - ./updates:/var/lib/metaclaude-updates

    networks:
      # `internal` reaches the proxy. `public` is what lets this container reach
      # *out*, and without it nothing the product does actually works: the Claude
      # CLI cannot call the Anthropic API, `git clone` cannot resolve a remote,
      # and no HTTP MCP server is reachable. A Docker network declared
      # `internal: true` has no route off the host at all, and `app` was on that
      # one alone — so the stack came up, reported healthy, passed the deploy's
      # health gate, and then failed every single run.
      #
      # This does not widen what can reach *in*. Inbound needs a published port,
      # `app` publishes none, and the proxy stays the only route to it.
      - internal
      - public

    # ── Hardening ─────────────────────────────────────────────────────────────
    # The agent executes model-authored commands. Everything below limits what
    # that can reach if a command does something unintended.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The CLI writes to its own cache and needs a real /tmp; the rootfs stays
    # read-only so nothing else in the image can be modified at runtime.
    read_only: true
    tmpfs:
      # `noexec` is deliberately absent: build tooling the agent runs (node-gyp,
      # cargo, pip) executes helper binaries it writes into /tmp, and forbidding
      # that breaks ordinary development work rather than an attack.
      - /tmp:rw,nosuid,size=1g
    ulimits:
      nofile: { soft: 8192, hard: 16384 }
      nproc: 4096

    deploy:
      resources:
        limits:
          # A cpus limit above the host's core count is not clamped — Docker
          # refuses to create the container at all ("range of CPUs is from 0.01
          # to 2.00, as there are only 2 CPUs available"). The default therefore
          # has to fit the smallest machine anyone would run this on, which is a
          # 2-vCPU VPS; a default of 4 made the stack unstartable there with an
          # unedited .env. bootstrap.sh raises it to the host's actual core count.
          cpus: '${METACLAUDE_CPU_LIMIT:-2}'
          # Not clamped either, but over-committing memory fails differently: the
          # container is allowed to grow past what the host has and the host's OOM
          # killer picks the victim, which may not be this container. bootstrap.sh
          # sizes it from real RAM for the same reason.
          memory: ${METACLAUDE_MEMORY_LIMIT:-2g}

    # The shutdown path gives in-flight runs 20 seconds to drain before forcing
    # exit. Docker's default grace is 10, so every deploy would SIGKILL the
    # process midway through writing a transcript.
    stop_grace_period: 30s

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  proxy:
    # Pinned, and 2.11.4 is a floor rather than a preference: earlier releases
    # cannot order a Let's Encrypt certificate for an IP address at all, and
    # the `profile` subdirective that mode needs is still experimental.
    image: caddy:2.11.4-alpine
    restart: unless-stopped

    # A reaper as PID 1, and it is the healthcheck below that requires it.
    #
    # Caddy is this image's PID 1 and does not reap orphans — no reason it
    # should; it never forks. But a `CMD-SHELL` healthcheck does: Docker runs it
    # through `docker exec`, its shell forks `wget` and `grep`, and whatever
    # outlives the shell is reparented to PID 1 inside the namespace. With
    # nothing reaping, each probe leaves one task behind for good.
    #
    # At a 5s interval that is 720 an hour against a pids ceiling of ~3600, so
    # the cgroup fills in about five hours. What happens then is not a crash —
    # Caddy keeps serving perfectly, because it never forks. It is `runc exec`
    # that can no longer fork the probe into a full cgroup, and it fails with
    #
    #     OCI runtime exec failed: unable to start container process:
    #     procReady not received
    #
    # so the healthcheck can never pass again, `docker exec` into the container
    # stops working, and the proxy is `unhealthy` forever on a deployment that
    # is in fact serving. `up --wait` then fails, and so does the deploy script's
    # health gate — on a healthy site.
    #
    # Found on a real deployment at 3643 tasks of a 3647 ceiling, with one live
    # process. The same host proved the fix: `app` runs the same kind of probe
    # 1700 times over 14 hours and sits flat at 18 tasks, because its image
    # entrypoint is tini. This gives the proxy the same thing without rebuilding
    # an image we do not own.
    init: true

    depends_on:
      app:
        condition: service_healthy

    # The bind address is explicit, and that matters more than it looks.
    #
    # Docker writes its own iptables rules into a chain the kernel consults
    # *before* ufw's, so a port published on 0.0.0.0 is reachable from the
    # internet even with a `ufw deny` in place. Naming the interface here is the
    # one control that holds regardless of what the firewall says.
    #
    #   0.0.0.0     public: the server is reached at its own IP
    #   100.x.y.z   VPN: the Tailscale/WireGuard address, nothing else exposed
    #   127.0.0.1   local only, for a tunnel
    #
    # The default is the *closed* one on purpose. An unset or mistyped variable
    # should make the service unreachable, not world-readable; exposing it
    # publicly is then something an operator wrote down deliberately.
    ports:
      - '${METACLAUDE_BIND:-127.0.0.1}:${METACLAUDE_HTTP_PORT:-80}:80'
      - '${METACLAUDE_BIND:-127.0.0.1}:${METACLAUDE_HTTPS_PORT:-443}:443'
      # HTTP/3. Caddy advertises it via Alt-Svc, and a phone on a flaky mobile
      # network is exactly where it earns its keep.
      - '${METACLAUDE_BIND:-127.0.0.1}:${METACLAUDE_HTTPS_PORT:-443}:443/udp'

    environment:
      # The address browsers use: an IP, or a hostname. See docker/Caddyfile.
      METACLAUDE_SITE: ${METACLAUDE_SITE:-localhost}
      # Which certificate to serve to a client that sent no SNI, or an SNI
      # matching no site. Both are real: a browser reaching an IP sends none
      # (RFC 6066 forbids IP literals there), and the container's own busybox
      # healthcheck sends the literal `127.0.0.1`.
      #
      # It defaults to METACLAUDE_SITE rather than to a constant, and that is
      # the whole point. `default_sni`/`fallback_sni` choose among the sites
      # that are *configured*; naming one no site block declares leaves nothing
      # to fall back to and the handshake dies with alert 80, before any log
      # line. Deriving it from the site means an operator who sets only
      # METACLAUDE_SITE — which is the documented minimum — cannot land there.
      METACLAUDE_SNI_DEFAULT: ${METACLAUDE_SNI_DEFAULT:-${METACLAUDE_SITE:-localhost}}
      # The second address, kept on the internal CA so that pointing a domain
      # at the box does not cost the IP that was the only way in. Inert while
      # unset: `alt.metaclaude.invalid` resolves nowhere.
      METACLAUDE_ALT_SITE: ${METACLAUDE_ALT_SITE:-alt.metaclaude.invalid}
      METACLAUDE_TLS_EMAIL: ${METACLAUDE_TLS_EMAIL:-internal}
      # Only read by the acme-ip mode. Point it at the staging directory while
      # testing: production allows five certificates per identifier set per
      # seven days, with no override.
      METACLAUDE_ACME_DIR: ${METACLAUDE_ACME_DIR:-}
      # Only read by the file mode: /certs/<name>.crt and .key.
      METACLAUDE_CERT_NAME: ${METACLAUDE_CERT_NAME:-metaclaude}
      # Chrome will not use QUIC against a locally-signed certificate, so under
      # the `internal` TLS mode set this to "h1 h2": h3 would be advertised,
      # declined, and silently fall back to TCP, leaving a UDP port open for
      # nothing. Defaulted here rather than in the Caddyfile because compose
      # passes an unset variable as the empty string, not as absent.
      METACLAUDE_PROTOCOLS: ${METACLAUDE_PROTOCOLS:-h1 h2 h3}

    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # One file per TLS mode; the mode names which is mounted here.
      - ./docker/tls/${METACLAUDE_TLS_MODE:-internal}.caddy:/etc/caddy/tls.caddy:ro
      # Holds the local CA under `internal`, and the ACME account and
      # certificates otherwise. Back it up: losing it under `internal` mints a
      # new CA, which every device then distrusts.
      - caddy-data:/data
      - caddy-config:/config
      # Only read in `file` mode. Empty otherwise, which costs nothing.
      - ${METACLAUDE_CERTS_DIR:-./docker/certs}:/certs:ro

    networks:
      - internal
      - public

    # ── Hardening ─────────────────────────────────────────────────────────────
    # Thinner than the app's, because the threat is different: this container
    # runs Caddy, not model-authored commands. But it is the only one reachable
    # from outside, so "the internet-facing service is the unconfined one" is a
    # poor place to end up.
    #
    # `no-new-privileges` is also set daemon-wide by provision.sh; repeated here
    # so the property does not depend on how the host was provisioned.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NET_BIND_SERVICE is genuinely required once ALL is dropped: the container
    # binds 80 and 443 itself.
    cap_add:
      - NET_BIND_SERVICE
    # The caddy image points XDG_CONFIG_HOME at /config and XDG_DATA_HOME at
    # /data, both named volumes above, so the certificates and the config
    # autosave land outside the rootfs.
    #
    # One thing does try to write to it: under `internal`, Caddy installs its
    # own root into the *container's* Linux trust store and logs "certificate
    # installed properly in linux trusts". That write now fails. It is
    # inconsequential — nothing inside this container validates against that
    # store, and the root that matters is the one operators export from /data —
    # and Caddy treats it as best-effort, but it is why this line is worth
    # checking against the smoke job rather than reasoning about: that job runs
    # the real stack in `internal` mode, which is exactly this path.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          # Small on purpose. A TLS terminator for one site does not need more,
          # and an unbounded proxy competing with the agent for the host's
          # memory is the failure this prevents.
          cpus: '${METACLAUDE_PROXY_CPU_LIMIT:-1}'
          memory: ${METACLAUDE_PROXY_MEMORY_LIMIT:-256m}

    # Without this the proxy had no healthcheck at all, and `up --wait` treats a
    # merely-running container as ready. Caddy's own startup order is why that
    # is not good enough:
    #
    #   "server running" protocols [h1 h2]      ← listening
    #   "serving initial configuration"
    #   "obtaining certificate" → "obtained"    ← only now can TLS complete
    #
    # `--wait` returned inside that window, and the next HTTPS request failed
    # with `tlsv1 alert internal error` against a deployment that was fine. Only
    # a real handshake closes it, so the probe speaks TLS; --no-check-certificate
    # because under `internal` the CA is Caddy's own and the question here is
    # readiness, not trust.
    #
    # The Host header is set, and the body is checked, on purpose. Probing
    # https://127.0.0.1/ without them reaches no site block at all — Caddy
    # answers an unmatched route with an empty 200, wget exits 0, and the
    # container reports healthy without a single byte having come from the app.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --no-check-certificate -O - --header "Host: $$METACLAUDE_SITE"
          https://127.0.0.1/api/health | grep -q '"status":"ok"'
      interval: 5s
      timeout: 5s
      retries: 12
      # Failures here do not count against `retries`, which matters in the ACME
      # modes: issuance has to reach Let's Encrypt and validate before the first
      # handshake can succeed.
      start_period: 60s

    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  # The app is unreachable except through the proxy.
  internal:
    internal: true
  public:

volumes:
  metaclaude-data:
  metaclaude-workspaces:
  metaclaude-home:
  caddy-data:
  caddy-config:
