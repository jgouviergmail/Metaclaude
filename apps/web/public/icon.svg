<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Metaclaude">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0f0f14" />
  <!-- An open ring: the agentic loop, deliberately not closed. -->
  <circle
    cx="256"
    cy="256"
    r="150"
    fill="none"
    stroke="url(#g)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-dasharray="710 232"
    transform="rotate(-45 256 256)"
  />
  <circle cx="256" cy="256" r="50" fill="url(#g)" />
</svg>
