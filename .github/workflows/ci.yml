# Continuous integration.
#
# Six jobs, in the order a failure is cheapest to discover:
#
#   deploy-scripts  the deployment layer, off-box          ~30 s
#   verify          typecheck, unit tests, build            ~2 min
#   live            the real server, booted and driven      ~1 min   (needs `verify`'s build)
#   browser         the real PWA in a real Chromium         ~3 min
#   image           the production image, built and pushed  ~5 min
#   smoke           that image, actually started and used   ~2 min   (needs `image`)
#
# `live` and `browser` run the same scripts an operator runs by hand
# (`check:e2e`, `check:browser`), minus the parts that need Claude credentials —
# those are skipped explicitly and counted, never silently dropped.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One CI run per ref. A newer push supersedes an older one still in flight,
# except on the default branch where every commit's verdict is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Matches `engines.node` in package.json. pnpm's version comes from the
  # `packageManager` field, which pnpm/action-setup reads on its own.
  NODE_VERSION: '22'

jobs:
  # Every push to main increments the version — the rule the operator asked
  # for, enforced rather than remembered. The comparison itself lives in
  # deploy/version-guard.sh so check.sh can prove it rejects an equal or
  # lower version; this job only fetches the two versions to compare.
  version-guard:
    name: Version increments
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The pushed version is strictly greater than the previous one
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          new="$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" packages/shared/src/constants.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$new" ] || { echo "::error::constants.ts no longer declares APP_VERSION"; exit 1; }
          # A newly created branch has no "before" to compare against.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "first push of this ref — nothing to compare against"; exit 0
          fi
          # An unfetchable "before" means main's history was rewritten, which
          # is its own emergency — fail loudly rather than shrug.
          git fetch --depth=1 origin "$BEFORE" \
            || { echo "::error::cannot fetch $BEFORE — was main force-pushed?"; exit 1; }
          old="$(git show "$BEFORE:packages/shared/src/constants.ts" | grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$old" ] || { echo "::error::could not read the previous APP_VERSION"; exit 1; }
          ./deploy/version-guard.sh "$old" "$new"

  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `--frozen-lockfile` is the point: it fails when package.json and the
      # lockfile disagree, which is exactly the drift the Dockerfile would hit
      # later with a much longer feedback loop.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The other packages import its build output, so this cannot be folded
      # into `pnpm build` — that would typecheck against a stale dist.
      - name: Build shared contracts
        run: pnpm --filter @metaclaude/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      # Handed to the jobs below so they do not each rebuild it.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/shared/dist
            apps/api/dist
            apps/web/dist
          retention-days: 1
          if-no-files-found: error

  live:
    name: Live server check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist

      # The shipped embedding model, once per pinned revision: the live check
      # is the one place the real model loads in CI before the image does.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.models
          key: embedding-model-${{ hashFiles('deploy/fetch-embedding-model.sh') }}
      - name: Fetch the embedding model
        run: deploy/fetch-embedding-model.sh Xenova/bge-m3 "${{ github.workspace }}/.models"

      # Boots the real server against a throwaway data directory: the guards,
      # the migrations, the static handler and the CSP, not a test double —
      # and, with the model fetched above, the semantic regime end to end.
      - name: End-to-end check
        env:
          METACLAUDE_E2E_NO_AGENT: '1'
          METACLAUDE_EMBEDDINGS: local
          METACLAUDE_EMBEDDING_MODEL: Xenova/bge-m3
          METACLAUDE_EMBEDDING_CACHE: ${{ github.workspace }}/.models
          METACLAUDE_E2E_EXPECT_SEMANTIC: '1'
        run: pnpm --filter @metaclaude/api check:e2e

  browser:
    name: Browser check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Install Chromium
        run: pnpm --filter @metaclaude/api exec playwright install --with-deps chromium

      # Serves the production build through the API's own static handler, so a
      # CSP violation or a broken tap target fails here rather than on a phone.
      - name: Browser check
        env:
          METACLAUDE_E2E_NO_AGENT: '1'
        run: pnpm --filter @metaclaude/api check:browser

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Both required by attest-build-provenance.
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase path, and this repository is `Metaclaude`.
      - name: Resolve the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has no write token, so it builds without
      # pushing — which still catches a broken Dockerfile.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `type=semver` entries below only ever fire on a *tag* event — and
      # the version tag is pushed by release-tag with GITHUB_TOKEN, whose
      # pushes deliberately trigger no workflows. So the version-tagged image
      # nobody was building is derived here instead, from the checkout's own
      # APP_VERSION: every green main push publishes ghcr…:v<version>, which
      # is exactly the reference the in-app Apply button composes.
      - name: Read the app version
        id: appver
        run: |
          version="$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" packages/shared/src/constants.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$version" ] || { echo "::error::could not read APP_VERSION"; exit 1; }
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.appver.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # attested explicitly below instead

      # Records, verifiably, that this image came from this workflow and this
      # commit — so a deploy can check it was not built somewhere else.
      #
      # Only possible on a public repository. GitHub's attestation API refuses
      # outright for a user-owned private one — "Feature not available for
      # user-owned private repositories. To enable this feature, please make
      # this repository public" — and this repository is private on purpose:
      # it holds the deployment for one person's server. Skipped rather than
      # marked continue-on-error, so a real attestation failure on a repository
      # that *can* attest still fails the build instead of passing quietly.
      - name: Attest provenance
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Everything above proves the source is good. This proves the *artefact* is:
  # it starts the image that was just pushed, behind the real Caddy, with the
  # real compose.yml, and drives it the way a browser would. Until now nothing
  # ever ran the image — which is exactly how a base-image pin that had never
  # existed survived in the Dockerfile.
  smoke:
    name: Deployed stack
    needs: image
    # A fork PR has no package write token, so there is no pushed digest to run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, not by tag: this must be the artefact this commit produced,
      # not whatever the tag points at by the time the job starts.
      #
      # The password carries a literal `$` and a literal `"`, written with the
      # escaping .env.example documents. Signing in with the literal value at
      # the end proves the whole chain held — the documented convention,
      # compose's interpolation, the container's environment, and the owner
      # account created on first boot.
      - name: Configure the stack as a server would
        env:
          IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "METACLAUDE_IMAGE=${IMAGE}"
            # Deliberately NOT 127.0.0.1. The proxy's healthcheck dials
            # https://127.0.0.1/ and busybox wget sends that literal as SNI;
            # with the site named 127.0.0.1 the two matched by accident and a
            # real deployment's mismatch went untested for weeks.
            echo 'METACLAUDE_SITE=smoke.metaclaude.test'
            echo 'METACLAUDE_TLS_MODE=internal'
            echo 'METACLAUDE_PROTOCOLS=h1 h2'
            echo 'METACLAUDE_BIND=127.0.0.1'
            echo 'METACLAUDE_BOOTSTRAP_USER=owner'
            echo 'METACLAUDE_BOOTSTRAP_PASSWORD="sm0ke-pa$$sw\"rd-9x"'
            echo "METACLAUDE_MASTER_KEY=$(openssl rand -hex 32)"
          } > .env
          echo "running ${IMAGE}"

      - name: Start
        run: docker compose up -d --wait --wait-timeout 240

      - name: It answers over TLS, and redirects plain HTTP
        run: |
          set -euo pipefail
          curl -fsS -k --resolve smoke.metaclaude.test:443:127.0.0.1 --max-time 15 https://smoke.metaclaude.test/api/health | grep -q '"status":"ok"'
          ct="$(curl -fsS -k --resolve smoke.metaclaude.test:443:127.0.0.1 --max-time 15 -o /dev/null -w '%{content_type}' https://smoke.metaclaude.test/)"
          case "$ct" in text/html*) ;; *) echo "the app root served '$ct', not HTML"; exit 1 ;; esac
          code="$(curl -sS --resolve smoke.metaclaude.test:80:127.0.0.1 --max-time 15 -o /dev/null -w '%{http_code}' http://smoke.metaclaude.test/)"
          case "$code" in 301|308) ;; *) echo "plain HTTP returned $code, expected a redirect"; exit 1 ;; esac

      - name: The security headers survive the proxy
        run: |
          set -euo pipefail
          h="$(curl -sS -k --resolve smoke.metaclaude.test:443:127.0.0.1 --max-time 15 -D - -o /dev/null https://smoke.metaclaude.test/)"
          for want in strict-transport-security x-content-type-options content-security-policy; do
            printf '%s' "$h" | grep -qi "^${want}:" || { echo "missing $want"; printf '%s' "$h"; exit 1; }
          done

      - name: The owner account works, with the dollar intact
        run: |
          set -euo pipefail
          code="$(curl -sS -k --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            --resolve smoke.metaclaude.test:443:127.0.0.1 -X POST https://smoke.metaclaude.test/api/auth/login \
            -H 'content-type: application/json' \
            --data-binary '{"username":"owner","password":"sm0ke-pa$sw\"rd-9x"}')"
          if [ "$code" != "200" ]; then
            echo "sign-in returned $code — the password did not survive the trip into the container"
            cat /tmp/login.json || true
            exit 1
          fi

      # The health gate never waited for the model — the API answers before
      # it loads — so this is where the image proves it ships one that works:
      # bge-m3 takes tens of seconds on a runner, and `semantic` flips only
      # once a first vector has come back.
      - name: The shipped model loads and retrieval is semantic
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          curl -sS -k --max-time 20 -c "$jar" -o /dev/null \
            --resolve smoke.metaclaude.test:443:127.0.0.1 -X POST https://smoke.metaclaude.test/api/auth/login \
            -H 'content-type: application/json' \
            --data-binary '{"username":"owner","password":"sm0ke-pa$sw\"rd-9x"}'
          body=''
          for _ in $(seq 1 60); do
            body="$(curl -sS -k --max-time 15 -b "$jar" --resolve smoke.metaclaude.test:443:127.0.0.1 https://smoke.metaclaude.test/api/system)"
            if printf '%s' "$body" | jq -e '.retrieval.semantic == true' >/dev/null 2>&1; then
              printf '%s' "$body" | jq '.retrieval'
              exit 0
            fi
            sleep 5
          done
          echo "::error::retrieval never became semantic inside the deployed image"
          printf '%s' "$body" | jq '.retrieval' || true
          exit 1

      - name: Logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v

  # The deploy scripts are the only code here that can lock the owner out of
  # their own server, and they are the least exercised — nothing imports them,
  # so a typo survives every other job. This checks what can be checked without
  # a host: they parse, they lint, compose accepts every TLS mode, and a secret
  # with awkward characters still arrives intact.
  # Ratchets are checked where the build exists, so the bundle ceiling is
  # measured rather than skipped. deploy/check.sh runs them too, but off-box it
  # can only see the static half.
  ratchets:
    name: Ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: No quality ratchet has regressed
        run: node deploy/ratchets.mjs

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check
        run: ./deploy/check.sh

  # A single required check to protect the branch with, so the rule does not
  # need editing every time a job is added or renamed.
  ci:
    name: CI
    if: always()
    needs: [version-guard, verify, live, browser, image, smoke, deploy-scripts, ratchets]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "live=${{ needs.live.result }}"
          echo "browser=${{ needs.browser.result }}"
          echo "image=${{ needs.image.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "deploy-scripts=${{ needs.deploy-scripts.result }}"
          # `contains` rather than `!= success` so a skipped job (a fork PR)
          # does not fail the gate, but a cancelled or failed one does.
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::at least one job did not pass"
            exit 1
          fi

  # Every green push to main leaves a release point: the version the push
  # declared becomes tag v<version>. The tag is bookkeeping the update check
  # reads and the operator deploys from; it is created with GITHUB_TOKEN, whose
  # pushes deliberately do not trigger the tag-driven Deploy workflow — so
  # deploying stays an explicit act unless the repository variable
  # METACLAUDE_AUTO_DEPLOY is set to "true", in which case the deploy workflow
  # is dispatched directly for this exact commit.
  release-tag:
    name: Tag the version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Create v<version> if it does not exist
        run: |
          version="$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" packages/shared/src/constants.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$version" ] || { echo "::error::could not read APP_VERSION"; exit 1; }
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "tag v$version already exists — a re-run, not a release"; exit 0
          fi
          git tag "v$version" "$GITHUB_SHA"
          git push origin "refs/tags/v$version"
          echo "tagged v$version at $GITHUB_SHA"
      # A bare tag is not a *release*: /releases/latest answers 404 on a repo
      # that only ever gets tagged, which is exactly what the in-app update
      # check asks. Publishing the release here, with the changelog section as
      # its notes, is what makes "you are behind" answerable. Independent of
      # the tag step on purpose — a re-run whose tag exists may still owe the
      # release.
      - name: Publish the GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" packages/shared/src/constants.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$version" ] || { echo "::error::could not read APP_VERSION"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$version already exists — nothing to publish"; exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          [ -s /tmp/release-notes.md ] || echo "See CHANGELOG.md." > /tmp/release-notes.md
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" \
            --title "v$version" --notes-file /tmp/release-notes.md --verify-tag
          echo "published release v$version"
      - name: Dispatch the deploy (only when METACLAUDE_AUTO_DEPLOY=true)
        if: vars.METACLAUDE_AUTO_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" -f action=deploy -f ref="$GITHUB_SHA"
